name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Apple Silicon: the only platform SC Prism builds for.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bootstrap pinned Python + Go toolchains
        run: ./scripts/bootstrap-toolchains.sh

      - name: Install
        run: npm ci

      - name: Gate
        run: |
          set -o pipefail
          ./verify.sh | tee verify.log
          # verify.sh skips a step — and still passes — when its toolchain is
          # missing, printing "== <step> == skipped". In CI every toolchain is
          # installed, so that means something broke. Match only that marker:
          # a passing Python run prints "OK (skipped=N)" for tests that skip
          # themselves, which is not a skipped STEP.
          if grep -qE "^== .* == skipped" verify.log; then
            echo "::error::a verify step was skipped in CI"
            exit 1
          fi
          test "$(tail -n 1 verify.log)" = "VERIFY: PASS"
